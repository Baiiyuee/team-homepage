<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学生主页跳转中</title>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const studentId = params.get('id') || '';
      const lang = params.get('lang') === 'en' ? 'en' : '';
      if (studentId) {
        sessionStorage.setItem('teamHomepagePendingStudent', studentId);
      }
      const target = `../index.html${lang ? '?lang=en' : ''}#education`;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>正在跳转到学生培养页面...</p>
</body>
</html>
